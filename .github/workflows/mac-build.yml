name: Orca fork macOS build
run-name: Orca fork macOS build ${{ inputs.tag }} (${{ inputs.arches }})

# Builds the macOS app for one release of registered2nd/orca (Stephen's patched Orca fork) from that
# repo's release tag, and leaves the update files as this run's artifact "mac-update": each arch's zip
# and dmg with their blockmaps, and one latest-mac.yml listing them. The release job
# (C:\Projects\_scripts\orca_patched_release.ps1) dispatches this, downloads the artifact and attaches
# it to the fork's release, feed last. It lives here, outside the fork, because GitHub assigned the
# fork's macOS arm64 jobs no runner after flagging the fork's workflows on 2026-11-06.
#
# Upstream's mac release steps, signed with the fork's own self-signed identity "Orca Personal Fork"
# (secrets MAC_SIGNING_P12 / MAC_SIGNING_P12_PASSWORD, from the vault item orca_fork_mac_signing)
# instead of Developer ID, and not notarized: every build carries the same designated requirement, so
# an installed fork app takes the next release as an in-app update.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of registered2nd/orca to build (e.g. v1.4.261)
        required: true
        type: string
      arches:
        description: Architectures to build
        type: choice
        default: arm64,x64
        options:
          - arm64,x64
          - arm64
          - x64

permissions:
  contents: read

concurrency:
  group: orca-mac-${{ inputs.tag }}
  cancel-in-progress: false

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # electron-builder and Orca's helper signing both take the identity from CSC_NAME.
  CSC_NAME: 904EE4880710302F9034220E872C4E634EF4F824
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ARCHES: ${{ inputs.arches }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # Native Intel runner for x64: packaging boots the x64 terminal host, which times out under Rosetta.
          runners = {'arm64': 'macos-15', 'x64': 'macos-15-intel'}
          include = [{'arch': a, 'runner': runners[a]} for a in os.environ['ARCHES'].split(',')]
          print('matrix=' + json.dumps({'include': include}))
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Checkout the fork's release tag
        uses: actions/checkout@v6
        with:
          repository: registered2nd/orca
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check the tag is the patched release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$TAG" || { echo "::error::the tag's tree is $version, not $TAG"; exit 1; }
          # The patched tree's top commit points the in-app updater at the fork's releases.
          git log -1 --format=%s | grep -qx 'local: take in-app updates from registered2nd/orca releases' \
            || { echo "::error::$TAG is not a patched release (top commit: $(git log -1 --format=%s))"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile --cpu=current,x64,arm64

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Regenerate the app functions catalog (fork feature)
        run: |
          if [ -f config/scripts/generate-app-functions-catalog.mjs ]; then
            node config/scripts/generate-app-functions-catalog.mjs || echo "::warning::app functions catalog not regenerated"
          fi

      # Before the build: build:native already signs Orca's macOS helpers with CSC_NAME.
      - name: Install the signing identity
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          printf %s "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # electron-builder only signs with an identity macOS trusts for code signing.
          security find-certificate -c "Orca Personal Fork" -p "$kc" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning | grep "$CSC_NAME"

      - name: Build app
        run: pnpm build:release

      - name: Package and sign
        run: |
          pinned=config/scripts/orcad-distribution/prebuilds/pinned-node-downloads.mjs
          [ -f "$pinned" ] || pinned=config/scripts/pinned-node-downloads.mjs
          ensure=config/scripts/native-build/node-addons/ensure-native-runtime.mjs
          [ -f "$ensure" ] || ensure=config/scripts/ensure-native-runtime.mjs
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "$pinned" darwin-arm64 darwin-x64
          node "$ensure" --runtime=electron
          # Orca's own builder config, with signatures that skip Apple's timestamp server: a
          # self-signed, un-notarized build has no use for the timestamps.
          cat > "$RUNNER_TEMP/fork-mac.config.cjs" <<EOF
          const base = require('$GITHUB_WORKSPACE/config/electron-builder.config.cjs')
          module.exports = { ...base, mac: { ...base.mac, timestamp: 'none' } }
          EOF
          pnpm exec electron-builder --config "$RUNNER_TEMP/fork-mac.config.cjs" --mac dmg zip --${{ matrix.arch }} --publish never
          app="$(ls -d dist/mac*/Orca.app | head -1)"
          codesign --verify --deep --strict "$app"
          requirement="$(codesign -d -r- "$app" 2>&1 | tail -1)"
          echo "$requirement"
          [[ "$requirement" == *"certificate root = H\"$(printf %s "$CSC_NAME" | tr A-F a-f)\""* ]]
          ls -la dist

      - name: Launch smoke test
        run: |
          app="$(ls -d dist/mac*/Orca.app | head -1)"
          mkdir -p smoke
          # Packaging runs Orca windowless; the smoke test wants its window.
          env -u ORCA_BACKGROUND_LAUNCH "$app/Contents/MacOS/Orca" >smoke/stdout.log 2>&1 &
          pid=$!
          sleep 60
          osascript -e 'tell application "Orca" to activate' || true
          sleep 5
          cat >smoke/windows.swift <<'SWIFT'
          import CoreGraphics
          let l = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID) as! [[String: Any]]
          let o = l.filter { ($0["kCGWindowOwnerName"] as? String) == "Orca" && ($0["kCGWindowLayer"] as? Int) == 0 }
          for w in o { print("window", w["kCGWindowBounds"] ?? "") }
          print("orca windows on screen:", o.count)
          SWIFT
          swift smoke/windows.swift | tee smoke/windows.txt || true
          screencapture -x smoke/screen.png || true
          if kill -0 "$pid" 2>/dev/null; then echo "Orca still running after 65 s"; kill "$pid"; else echo "::error::Orca exited"; cat smoke/stdout.log; exit 1; fi
          grep -q "orca windows on screen: [1-9]" smoke/windows.txt || { echo "::error::no Orca window on screen"; exit 1; }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.arch }}
          path: smoke/
          if-no-files-found: ignore
          retention-days: 7

      # Its own folder: Orca's build writes its compiled code to out/.
      - name: Collect the update files
        run: |
          mkdir -p mac-update
          cp dist/latest-mac.yml "mac-update/latest-mac-${{ matrix.arch }}.yml"
          shopt -s nullglob
          cp dist/*.zip dist/*.zip.blockmap dist/*.dmg dist/*.dmg.blockmap mac-update/
          ls -la mac-update

      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          path: mac-update/
          if-no-files-found: error
          retention-days: 3

  feed:
    needs: build
    # An arch that failed must not hold back the other; Apple silicon is required.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: mac-*
          merge-multiple: true
          path: out

      - name: Merge the update feed
        run: |
          python3 - <<'PY'
          import glob, os, re
          files, meta = [], {}
          for path in sorted(glob.glob('out/latest-mac-*.yml')):
              text = open(path).read()
              meta.setdefault('version', re.search(r'^version: (.+)$', text, re.M).group(1))
              for key in ('releaseDate', 'minimumSystemVersion'):
                  m = re.search(rf'^{key}: (.+)$', text, re.M)
                  if m:
                      meta[key] = m.group(1)
              files += re.findall(r'^  - url: (.+)\n    sha512: (.+)\n    size: (\d+)$', text, re.M)
              os.remove(path)
          if not any('arm64' in url for url, _, _ in files):
              raise SystemExit('no Apple silicon build to publish')
          zip_main = next(f for f in files if f[0].endswith('-arm64-mac.zip'))
          lines = [f"version: {meta['version']}", 'files:']
          for url, sha, size in files:
              lines += [f'  - url: {url}', f'    sha512: {sha}', f'    size: {size}']
          lines += [f'path: {zip_main[0]}', f'sha512: {zip_main[1]}']
          lines += [f'{k}: {meta[k]}' for k in ('releaseDate', 'minimumSystemVersion') if k in meta]
          open('out/latest-mac.yml', 'w').write('\n'.join(lines) + '\n')
          PY
          cat out/latest-mac.yml
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: mac-update
          path: out/
          if-no-files-found: error
          retention-days: 3
